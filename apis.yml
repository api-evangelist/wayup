name: wayup
description: WayUp is a US early-career job and internship marketplace that connects college
  students and recent graduates with roles at 3,800+ vetted employers. Founded as Campus Job and
  rebranded WayUp in 2015, it was acquired by campus-recruiting company Yello in 2021. Candidates
  upload a resume and are matched to entry-level jobs, internships, and virtual career fairs, while
  employers use WayUp for early-talent sourcing and diversity recruiting. As of this profile WayUp
  publishes no public developer API or developer portal; its surface is a consumer web application
  plus a Help Scout knowledge base. It was surfaced as a portfolio company of Slow Ventures.
